<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Organizer Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <div>
      <div class="brand">ECE QUIZ</div>
      <div class="muted">Organizer Dashboard</div>
    </div>
    <nav><a href="index.html">Quiz</a></nav>
  </header>
  <main class="container">
    <section id="loginCard" class="card narrow">
      <span class="eyebrow">Restricted</span>
      <h1>Organizer Login</h1>
      <p>The password is checked only by Apps Script; it is not stored in this website.</p>
      <label>Organizer password<input id="password" type="password" autocomplete="current-password"></label>
      <p id="loginError" class="error"></p>
      <button id="loginBtn" class="btn primary">Login</button>
    </section>

    <section id="dashboard" hidden>
      <div class="sectionhead">
        <div>
          <span class="eyebrow">Protected results</span>
          <h1>Organizer Dashboard</h1>
          <p id="summary" class="muted"></p>
        </div>
        <div class="actions inline">
          <button id="refreshBtn" class="btn">Refresh</button>
          <button id="csvBtn" class="btn">Export CSV</button>
          <button id="logoutBtn" class="btn danger">Logout</button>
        </div>
      </div>
      <p id="dashError" class="error"></p>
      <div class="card tablewrap">
        <table>
          <thead>
            <tr>
              <th>Rank</th><th>Name</th><th>Participant ID</th><th>Email</th>
              <th>Institution</th><th>Score</th><th>Answered</th><th>Time</th><th>Submitted</th>
            </tr>
          </thead>
          <tbody id="resultsBody"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
